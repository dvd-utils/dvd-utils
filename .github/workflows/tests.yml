name: Tests

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake qt6-base-dev qt6-base-dev-tools qt6-tools-dev dvdauthor mencoder

      - name: Configure project
        run: cmake -S . -B build

      - name: Build test targets
        run: cmake --build build --target bdsup2subplusplus_tests bdsup2subplusplus_palette_behavior_tests bdsup2subplusplus_paletteinfo_tests bdsup2subplusplus_numberutil_tests bdsup2subplusplus_hr_time_tests

      - name: Run tests
        run: ctest --test-dir build --output-on-failure
