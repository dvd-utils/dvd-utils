
# End-to-end tests for build_dvd.sh using checked-in test assets:
#   tests/chicken_PAL.mpg   – short PAL MPEG-2 clip
#   tests/chicken_NTSC.mpg  – short NTSC MPEG-2 clip
#   tests/chicken.srt       – subtitle track shared by both
#
# The workflow runs the full pipeline (analysis → encoding → authoring → ISO)
# for each video format and validates the resulting DVD-Video structure.

name: DVD Builder E2E Tests

on:
  push:
    paths:
      - '**/*.sh'
      - 'tests/**'
      - '.github/workflows/dvd-builder-tests.yml'
  pull_request:
    paths:
      - '**/*.sh'
      - 'tests/**'
      - '.github/workflows/dvd-builder-tests.yml'
  workflow_dispatch:

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  test:
    name: Build ${{ matrix.format }} DVD
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        format: [PAL, NTSC]

    steps:
      # ------------------------------------------------------------------
      # 1 Checkout
      # ------------------------------------------------------------------
      - uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # 2. Verify the checked-in test assets exist and are non-empty
      # ------------------------------------------------------------------
      - name: Verify test files exist
        run: |
          echo "=== Checking test assets ==="
          for f in "tests/chicken_PAL.mpg" "tests/chicken_NTSC.mpg" "tests/chicken.srt"; do
            test -f "$f" || { echo "❌ Test file not found: $f"; exit 1; }
            test -s "$f" || { echo "❌ Test file is empty: $f"; exit 1; }
          done
          echo "✅ All test files present"
          echo ""
          echo "File sizes:"
          ls -lh tests/chicken_PAL.mpg tests/chicken_NTSC.mpg tests/chicken.srt

      # ------------------------------------------------------------------
      # 3. Install system packages
      #    - ffmpeg / ffprobe : video probing & encoding
      #    - dvdauthor / spumux : DVD-Video authoring & subtitle muxing
      #    - imagemagick        : menu background/highlight generation
      #    - genisoimage        : ISO creation for final validation
      #    - default-jre-headless : fallback for bdsup2sub.jar if needed
      #    - qt6-base-dev      : build dependency for bdsup2sub++
      # ------------------------------------------------------------------
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            dvdauthor \
            imagemagick \
            genisoimage \
            default-jre-headless \
            qt6-base-dev \
            git \
            build-essential

      # ------------------------------------------------------------------
      # 4. Build bdsup2sub++ (not packaged in Ubuntu repos)
      #    If the build fails we fall back to a stub so the tool-check
      #    passes — subtitle conversion won't work but basic DVD
      #    authoring (the focus of this E2E test) still proceeds.
      # ------------------------------------------------------------------
      - name: Build bdsup2sub++ from source
        id: build_bdsup
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/prinsbert/VobSub-Utilities.git

          PRO_FILE="$(find VobSub-Utilities -name 'bdsup2sub++.pro' -type f | head -1)"
          if [ -z "$PRO_FILE" ]; then
            echo "No .pro file found in VobSub-Utilities repository"
            exit 1
          fi

          PRO_DIR="$(dirname "$PRO_FILE")"
          mkdir -p "$PRO_DIR/build"
          cd "$PRO_DIR/build"
          qmake6 ../bdsup2sub++.pro
          make -j"$(nproc)"

          sudo cp bdsup2sub++ /usr/local/bin/
          bdsup2sub++ --help 2>&1 | head -1 || true

      - name: Fallback — create bdsup2sub++ stub
        if: steps.build_bdsup.outcome == 'failure'
        run: |
          echo "⚠ bdsup2sub++ build failed; creating a stub so the tool-check passes."
          echo "  Subtitle conversion will not work, but DVD authoring will be tested."

          sudo tee /usr/local/bin/bdsup2sub++ << 'STUB'
          #!/usr/bin/env bash
          # CI stub — creates empty output files so the build script
          # can proceed past the bdsup2sub tool-check stage.
          OUT=""
          while [ $# -gt 0 ]; do
            case "$1" in
              -o|--output) shift; OUT="$1" ;;
            esac
            shift
          done
          [ -n "$OUT" ] && mkdir -p "$(dirname "$OUT")" && : > "$OUT"
          exit 0
          STUB
          sudo chmod +x /usr/local/bin/bdsup2sub++

      # ------------------------------------------------------------------
      # 5. Verify every tool the script calls with `need()` is present
      # ------------------------------------------------------------------
      - name: Verify all required tools
        run: |
          echo "=== Tool verification ==="
          for tool in ffmpeg ffprobe dvdauthor spumux convert genisoimage bdsup2sub++; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "  ✓ $tool → $(command -v "$tool")"
            else
              echo "  ✗ $tool NOT FOUND"
              exit 1
            fi
          done

          echo ""
          echo "=== ImageMagick smoke test ==="
          convert -size 100x100 xc:black /tmp/_imtest.png
          convert /tmp/_imtest.png -fill white -font DejaVu-Sans-Bold -pointsize 12 \
            -annotate +10+10 "OK" /tmp/_imtest2.png
          rm -f /tmp/_imtest.png /tmp/_imtest2.png
          echo "  ✓ ImageMagick xc: + annotate works"

          echo ""
          echo "=== Font availability ==="
          convert -list font | grep -iE 'Font: .*(Arial-Bold|DejaVu-Sans-Bold|Helvetica-Bold)' \
            || { echo "  ⚠ No preferred bold font found; available fonts:"; convert -list font | grep 'Font:'; }

      # ------------------------------------------------------------------
      # 6. Set up a self-contained test directory per format
      #    The main movie and the extra use the SAME .mpg (guaranteed
      #    same format so verify_matches_main_format passes).
      #    The .srt is copied alongside each video so subtitles.sh
      #    can discover it if it supports SRT; if not, the build
      #    still succeeds without subtitles.
      # ------------------------------------------------------------------
      - name: Set up test environment (${{ matrix.format }})
        run: |
          FMT="${{ matrix.format }}"
          TEST_DIR="test_$FMT"
          mkdir -p "$TEST_DIR/extras"

          # Main movie
          cp "tests/chicken_$FMT.mpg" "$TEST_DIR/chicken_$FMT.mpg"
          cp "tests/chicken.srt"      "$TEST_DIR/chicken_$FMT.srt"

          # Extra (same file → identical format, guaranteed to pass the
          # verify_matches_main_format check)
          cp "tests/chicken_$FMT.mpg" "$TEST_DIR/extras/bonus_clip.mpg"
          cp "tests/chicken.srt"      "$TEST_DIR/extras/bonus_clip.srt"

          echo "=== Test directory layout ($FMT) ==="
          find "$TEST_DIR" -type f -exec ls -lh {} \;

      # ------------------------------------------------------------------
      # 7. Run build_dvd.sh end-to-end
      #    - `echo y |` answers the interactive confirmation prompt
      #    - -m explicitly sets the main movie (tests the flag)
      #    - -e provides the extras directory
      #    - -d en sets default subtitle language to English
      # ------------------------------------------------------------------
      - name: Run DVD builder (${{ matrix.format }})
        run: |
          FMT="${{ matrix.format }}"
          TEST_DIR="test_$FMT"
          OUTPUT_DIR="dvd_output_$FMT"
          WORK_DIR="work_$FMT"

          echo "y" | bash ./build_dvd.sh \
            -i "$TEST_DIR" \
            -m "$TEST_DIR/chicken_$FMT.mpg" \
            -e "$TEST_DIR/extras" \
            -o "$OUTPUT_DIR" \
            -w "$WORK_DIR" \
            -d "en"

          echo ""
          echo "build_dvd.sh exited with code: $?"

      # ------------------------------------------------------------------
      # 8. Verify the DVD-Video directory structure
      #    A valid DVD-Video must contain:
      #      VIDEO_TS.{IFO,BUP,VOB}  — disc-level menu (VMGM)
      #      VTS_01_0.{IFO,BUP}      — titleset 1 IFO + backup
      #      VTS_01_1.VOB            — titleset 1 video (main movie)
      #      VTS_02_0.{IFO,BUP}      — titleset 2 IFO + backup
      #      VTS_02_1.VOB            — titleset 2 video (extras)
      # ------------------------------------------------------------------
      - name: Verify DVD structure (${{ matrix.format }})
        run: |
          set -e
          OUT="dvd_output_${{ matrix.format }}"

          echo "=== DVD output tree ==="
          find "$OUT" -type f | sort | while read -r f; do
            printf "  %-50s %10d bytes\n" "$f" "$(stat -c%s "$f")"
          done

          echo ""
          echo "=== Validating required files ==="

          # --- VMGM (disc-level menu) ---
          for f in VIDEO_TS.IFO VIDEO_TS.BUP VIDEO_TS.VOB; do
            test -s "$OUT/VIDEO_TS/$f" || { echo "  ❌ Missing/empty: $f"; exit 1; }
            echo "  ✓ $f"
          done

          # --- Titleset 1 (main movie) ---
          for f in VTS_01_0.IFO VTS_01_0.BUP VTS_01_1.VOB; do
            test -s "$OUT/VIDEO_TS/$f" || { echo "  ❌ Missing/empty: $f"; exit 1; }
            echo "  ✓ $f"
          done

          # --- Titleset 2 (extras) ---
          for f in VTS_02_0.IFO VTS_02_0.BUP VTS_02_1.VOB; do
            test -s "$OUT/VIDEO_TS/$f" || { echo "  ❌ Missing/empty: $f"; exit 1; }
            echo "  ✓ $f"
          done

          echo ""
          echo "✅ All DVD structure checks passed for ${{ matrix.format }}"

      # ------------------------------------------------------------------
      # 9. Validate with genisoimage — if the DVD-Video structure
      #    is malformed, genisoimage -dvd-video will fail.
      # ------------------------------------------------------------------
      - name: Test ISO generation (${{ matrix.format }})
        run: |
          OUT="dvd_output_${{ matrix.format }}"
          ISO="/tmp/test_dvd_${{ matrix.format }}.iso"

          genisoimage -dvd-video -o "$ISO" "$OUT"

          test -s "$ISO" || { echo "❌ ISO not created or empty"; exit 1; }
          SIZE=$(stat -c%s "$ISO")
          echo "✅ ISO created: $SIZE bytes ($(( SIZE / 1024 )) KiB)"

      # ------------------------------------------------------------------
      # 10. Always print the generated XML for debugging
      # ------------------------------------------------------------------
      - name: Show generated dvdauthor XML
        if: always()
        run: |
          XML="work_${{ matrix.format }}/dvdauthor.xml"
          if [ -f "$XML" ]; then
            echo "=== $XML ==="
            cat "$XML"
          else
            echo "(dvdauthor.xml not found — the build likely failed before authoring)"
          fi

      # ------------------------------------------------------------------
      # 11. Upload artifacts for post-mortem inspection
      # ------------------------------------------------------------------
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dvd-${{ matrix.format }}
          path: |
            dvd_output_${{ matrix.format }}/
            work_${{ matrix.format }}/logs/
            work_${{ matrix.format }}/dvdauthor.xml
          retention-days: 7
          if-no-files-found: ignore